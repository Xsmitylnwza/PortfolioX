<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ModeNote — voice becomes working memory</title>
  <desc id="desc">A dark editorial cover with a microphone, live waveform, transcript and evidence cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090d"/>
      <stop offset="0.58" stop-color="#101116"/>
      <stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <radialGradient id="warm" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f07845" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#f07845" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mint" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#42d8b1" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#42d8b1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f07845"/>
      <stop offset="1" stop-color="#42d8b1"/>
    </linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="1000" rx="34" fill="url(#grid)"/>
  <ellipse cx="1260" cy="310" rx="390" ry="360" fill="url(#warm)"/>
  <ellipse cx="950" cy="760" rx="420" ry="280" fill="url(#mint)"/>

  <g transform="translate(86 78)">
    <g transform="translate(0 1)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="54" height="54" rx="14" fill="#11141a" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect x="20" y="11" width="14" height="24" rx="7" stroke="#ffffff" stroke-width="3"/>
      <path d="M14 29c0 11 26 11 26 0M27 41v6" stroke="#42d8b1" stroke-width="3"/>
    </g>
    <text x="72" y="39" fill="#f7f7f4" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="700" letter-spacing="-1.5">ModeNote</text>
    <text x="0" y="104" fill="#42d8b1" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" letter-spacing="3.2">CONTEXT-AWARE VOICE INTELLIGENCE · 2026</text>
  </g>

  <g transform="translate(86 282)">
    <text fill="#f7f7f4" font-family="Inter, Arial, sans-serif" font-size="104" font-weight="750" letter-spacing="-6">
      <tspan x="0" y="0">VOICE BECOMES</tspan>
      <tspan x="0" y="106">WORKING MEMORY.</tspan>
    </text>
    <text x="4" y="170" fill="#b7bac3" font-family="Inter, Arial, sans-serif" font-size="25">
      Thai-English conversation → timestamped evidence → action
    </text>
  </g>

  <g transform="translate(1032 214)">
    <circle cx="210" cy="206" r="172" fill="#0c0e13" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="210" cy="206" r="128" fill="none" stroke="#f07845" stroke-opacity="0.25"/>
    <circle cx="210" cy="206" r="88" fill="#f07845" fill-opacity="0.09" stroke="#f07845" stroke-opacity="0.5"/>
    <circle cx="210" cy="206" r="66" fill="#f07845" fill-opacity="0.14" filter="url(#glow)"/>
    <g transform="translate(160 129)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="27" y="0" width="46" height="92" rx="23" stroke="#f7f7f4" stroke-width="10"/>
      <path d="M5 70c0 60 90 60 90 0M50 118v29M27 147h46" stroke="#f7f7f4" stroke-width="10"/>
      <path d="M-46 50h18M-62 68h34M128 50h18M128 68h34" stroke="#42d8b1" stroke-width="8"/>
    </g>
  </g>

  <g transform="translate(88 600)">
    <rect x="0" y="0" width="862" height="128" rx="20" fill="#111319" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="30" y="38" fill="#f07845" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" letter-spacing="2.2">LIVE · 00:34</text>
    <text x="30" y="80" fill="#f5f5f2" font-family="Inter, Arial, sans-serif" font-size="23">The strongest signal is fast capture,</text>
    <text x="30" y="108" fill="#b7bac3" font-family="Inter, Arial, sans-serif" font-size="19">ไม่ใช่ meeting dashboard อีกอัน.</text>
    <path d="M548 69h13l10-27 14 58 16-72 16 70 14-45 14 32 13-16h17l11-26 14 45 14-31 14 12h23" fill="none" stroke="url(#signal)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(1034 604)">
    <rect width="476" height="124" rx="20" fill="#111319" stroke="#42d8b1" stroke-opacity="0.28"/>
    <text x="28" y="36" fill="#42d8b1" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" letter-spacing="2.2">EVIDENCE CARD</text>
    <text x="28" y="76" fill="#f5f5f2" font-family="Inter, Arial, sans-serif" font-size="21">“fast capture”</text>
    <text x="28" y="104" fill="#8f939e" font-family="Inter, Arial, sans-serif" font-size="15">Transcript · 00:34 · strong</text>
  </g>

  <g transform="translate(88 798)" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" letter-spacing="1.7">
    <g>
      <rect width="260" height="58" rx="29" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="29" cy="29" r="5" fill="#f07845"/>
      <text x="49" y="35" fill="#e8e8e5">LIVE TRANSCRIPT</text>
    </g>
    <g transform="translate(278)">
      <rect width="248" height="58" rx="29" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="29" cy="29" r="5" fill="#42d8b1"/>
      <text x="49" y="35" fill="#e8e8e5">CITED RECAP</text>
    </g>
    <g transform="translate(544)">
      <rect width="348" height="58" rx="29" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="29" cy="29" r="5" fill="#f07845"/>
      <text x="49" y="35" fill="#e8e8e5">SEARCH · CHAT · EXPORT</text>
    </g>
    <g transform="translate(910)">
      <rect width="352" height="58" rx="29" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="29" cy="29" r="5" fill="#42d8b1"/>
      <text x="49" y="35" fill="#e8e8e5">SCOPED MCP FOR AGENTS</text>
    </g>
  </g>

  <path d="M88 923H1512" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="88" y="957" fill="#787c87" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" letter-spacing="2">RECORD FIRST · RECOVERABLE AUDIO · EVIDENCE-BACKED AI</text>
  <text x="1512" y="957" text-anchor="end" fill="#f07845" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" letter-spacing="2">MODENOTE.XSMITY.CLOUD</text>
</svg>
